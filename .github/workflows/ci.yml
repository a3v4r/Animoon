name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Фронтенд (типы и сборка)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  rust:
    name: Rust (clippy, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Системные пакеты (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev

      # версия закреплена: новые линты clippy с -D warnings краснили бы CI без изменений в коде
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # generate_context!() требует ../dist, для clippy хватит пустой папки
      - name: Заглушка frontendDist
        run: mkdir -p dist

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
